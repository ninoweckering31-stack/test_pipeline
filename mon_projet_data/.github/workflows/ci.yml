name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dbt-ci:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mon_projet_data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          mon_projet_data:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: dev.duckdb
                schema: main
          EOF

      - name: Run dbt build
        run: |
          dbt build